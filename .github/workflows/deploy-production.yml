name: Deploy production to cPanel

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    # Leave this disabled until the dedicated FTP account and secrets are ready.
    if: github.ref == 'refs/heads/production' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out production
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stop if PHP dependencies changed
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if git diff --name-only "$PREVIOUS_SHA" "$CURRENT_SHA" -- composer.lock | grep -q .; then
            echo 'composer.lock changed. This FTP deployment does not install vendor packages; update dependencies on the server before deploying.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Package runtime files only
        run: |
          mkdir -p .deploy-package/bootstrap .deploy-package/database .deploy-package/resources
          rsync -a app/ .deploy-package/app/
          cp bootstrap/app.php bootstrap/providers.php .deploy-package/bootstrap/
          rsync -a config/ .deploy-package/config/
          rsync -a database/migrations/ .deploy-package/database/migrations/
          rsync -a --exclude='hot' --exclude='storage' --exclude='.DS_Store' public/ .deploy-package/public/
          rsync -a resources/views/ .deploy-package/resources/views/
          rsync -a routes/ .deploy-package/routes/
          cp artisan composer.json composer.lock .deploy-package/

      - name: Upload to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PRODUCTION_FTP_HOST }}
          username: ${{ secrets.PRODUCTION_FTP_USER }}
          password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: 21
          local-dir: ./.deploy-package/
          # A dedicated FTP account must have the Laravel app directory as its root.
          server-dir: ./
          state-name: .ftp-deploy-production-state.json
