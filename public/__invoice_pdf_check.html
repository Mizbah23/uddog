<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice PDF verification</title><style>body{background:#eef0f6;font-family:Arial,sans-serif;padding:20px}button{min-height:44px;padding:12px;margin:8px}canvas{display:block;max-width:100%;height:auto;margin:20px auto;box-shadow:0 4px 15px #0002}#status{padding:12px}</style><h1>Invoice PDF verification — sample data</h1><button id="mobile">Show mobile invoice preview</button><button id="download">Download sample PDF</button><button id="landscape">Download landscape regression</button><div id="status">Loading…</div><div id="pages"></div><script type="module">
import 'http://127.0.0.1:5173/resources/css/app.css';
import 'http://127.0.0.1:5173/resources/css/responsive.css';
import 'http://127.0.0.1:5173/resources/css/invoice-responsive.css';
import { saveCanvasPdf } from 'http://127.0.0.1:5173/resources/js/profitLossExport.js';
import { renderInvoicePages, saveInvoicePdf } from 'http://127.0.0.1:5173/resources/js/invoiceExport.js';
const invoice = {company:'অবন্তিকা টেলিকম এন্ড ইলেকট্রনিক্স (এসআইটি কোম্পানি লিঃ)',title:'বিক্রয় চালান',number:'SAL-PDF-TEST',meta:[['তারিখ','০১ নভেম্বর, ২০২৬'],['ক্রেতা','ননি গোপাল · 01700000000'],['প্রক্রিয়া করেছেন','Asim Bairagi'],['শাখা','প্রধান শাখা']],columns:['ক্রমিক','পণ্য','পরিমাণ','একক মূল্য','পরিমাণ'],items:Array.from({length:65},(_,i)=>[i+1,(i===1?'অনেক লম্বা পণ্যের নাম — বিশেষ মানের নাজিরশাইল চাল এবং অন্যান্য পণ্য বিস্তারিত বিবরণ ': 'নাজিরশাইল চাল ৫ কেজি')+'\nSKU-'+i,'২৫ pc','৳১,২০০.০০','৳৩০,০০০.০০']),totals:[['উপমোট','৳১৯,৫০,০০০.০০'],['ছাড়','৳০.০০'],['কর','৳০.০০'],['মোট','৳১৯,৫০,০০০.০০',true],['পরিশোধিত','৳১৯,৫০,০০০.০০'],['বকেয়া','৳০.০০']],notesLabel:'মন্তব্য',notes:'সঠিক পণ্য বুঝে নেওয়ার জন্য ধন্যবাদ।\nএটি পরীক্ষার জন্য তৈরি চালান।',pageLabel:'পৃষ্ঠা',installmentTitle:'কিস্তি পরিশোধের সময়সূচি',installmentColumns:['#','পরিশোধের তারিখ','কিস্তি','পরিশোধিত','বাকি'],installments:[['১','০১ ডিসেম্বর, ২০২৬','৳১,০০০.০০','৳০.০০','৳১,০০০.০০']]};
await document.fonts.ready;
const pages=renderInvoicePages(invoice);for(const page of pages)document.querySelector('#pages').append(page);
document.querySelector('#status').textContent=`Rendered ${pages.length} A4 pages; 65 invoice items; Bengali text and installment schedule.`;
document.querySelector('#mobile').onclick=()=>{
 const box=document.createElement('div');box.className='modal-backdrop-app';box.innerHTML=`<div class="modal-card wide invoice-modal"><div class="modal-head"><div><span class="eyebrow">SAMPLE INVOICE</span><h2>SAL-PDF-TEST</h2></div><button class="icon-button" aria-label="Close preview">×</button></div><div class="invoice-sheet"><div class="invoice-company"><div><span class="brand-mark">U</span><div><h3>${invoice.company}</h3><p>নমুনা চালান — পরীক্ষার তথ্য</p></div></div><span class="invoice-type">বিক্রয়</span></div><div class="invoice-meta"><div><span>চালান নম্বর</span><strong>SAL-PDF-TEST</strong></div><div><span>তারিখ ও সময়</span><strong>০১ নভেম্বর, ২০২৬ · ০২:৪৫ PM</strong></div><div><span>ক্রেতা</span><strong>ননি গোপাল</strong></div><div><span>প্রক্রিয়া করেছেন</span><strong>Asim Bairagi</strong></div></div><div class="invoice-table-wrap"><table class="invoice-table"><thead><tr><th>#</th><th>পণ্য</th><th>পরিমাণ</th><th>একক মূল্য</th><th>পরিমাণ</th></tr></thead><tbody>${invoice.items.slice(0,2).map((r,i)=>`<tr><td>${i+1}</td><td><strong>${r[1]}</strong></td><td data-label="পরিমাণ">${r[2]}</td><td data-label="একক মূল্য">${r[3]}</td><td data-label="পরিমাণ">${r[4]}</td></tr>`).join('')}</tbody></table></div><div class="invoice-summary"><div class="invoice-totals"><div class="invoice-grand-total"><span>মোট</span><strong>৳৬০,০০০.০০</strong></div><div><span>পরিশোধিত</span><strong>৳৬০,০০০.০০</strong></div><div><span>বকেয়া</span><strong>৳০.০০</strong></div></div></div><div class="modal-actions invoice-actions"><button class="btn-secondary-app">বন্ধ করুন</button><button class="btn-primary-app invoice-download">পিডিএফ ডাউনলোড</button><button class="btn-primary-app">চালান প্রিন্ট করুন</button></div></div></div>`;document.body.append(box);box.querySelector('.icon-button').onclick=()=>box.remove();box.querySelector('.invoice-download').onclick=()=>saveInvoicePdf(invoice,'SAL-PDF-TEST');
};
document.querySelector('#landscape').onclick=()=>{const c=document.createElement('canvas');c.width=1200;c.height=600;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,1200,600);x.fillStyle='black';x.font='30px Arial';x.fillText('Existing landscape report regression',40,70);saveCanvasPdf(c,'LANDSCAPE-REGRESSION');};
document.querySelector('#download').onclick=()=>saveInvoicePdf(invoice,'SAL-PDF-TEST');
</script></html>
